<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About · Tayyib Food</title>
    <link rel="stylesheet" type="text/css" href="default.css"/>
</head>
<body>
<!-- google translate start -->
<div style="float: right" id="google_translate_element"></div>
<script>
    // noinspection JSUnusedGlobalSymbols
    function googleTranslateElementInit() {
        // noinspection JSUnresolvedReference
        new google.translate.TranslateElement(
            {pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
            'google_translate_element'
        );
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<!-- google translate end -->

<section>
    <h1>Contacts</h1>
    <span id="email">support@tayyib.live</span>
    <button id="copyEmailToClipboardButton"
            style="background: none; cursor:pointer; vertical-align:top; display: none"
            onclick="copyEmailToClipboard()">
        <img style="filter: invert()" src="img/copy.png" alt="Copy">
    </button>
    <script>
        if(navigator.clipboard) {
            const copyEmailToClipboardButton = document.getElementById('copyEmailToClipboardButton');
            function copyEmailToClipboard() {
                const emailElement = document.getElementById('email');
                navigator.clipboard.writeText(emailElement.textContent);
            }
            copyEmailToClipboardButton.style.removeProperty('display');
        }
    </script>
</section>
