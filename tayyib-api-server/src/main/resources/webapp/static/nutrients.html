<body>
<h1>Nutrients</h1>

<smart-grid id="grid"></smart-grid>


<!--

<script type="text/javascript" src="smart-webcomponents-community/source/modules/smart.grid.js"></script>

<script>
    Smart('#grid', class {
        get properties() {
            return {
                behavior: {columnResizeMode: 'growAndShrink'},
                appearance: {
                    showColumnHeaderLines: false,
                    showColumnLines: false,
                    showRowLines: false
                },
                selection: {
                    enabled: true,
                    mode: 'extended',
                    allowCellSelection: true
                },
                sorting: {
                    enabled: false
                },
                filtering: {
                    enabled: false
                },
                onRowInit: function (index, row) {
                    row.expanded = true;
                },
                columns: [
                    {label: 'Name', dataField: 'name'},
                    {label: 'Description', dataField: 'description'},
                ],

                dataSource: new Smart.DataAdapter(
                    {
                        virtualDataSource: function (resultCallbackFunction, details) {
                            if (details.action === 'dataBind') {
                                // inits the demo server.
                                fetch("graphql", {
                                    method: "POST",
                                    headers: {'content-type': 'application/json'},
                                    body: '{"query":"{shows (titleFilter: \\"\\") {id parent_id name description links{id url title}}}"}'
                                })
                                    .then((httpResp) => httpResp.json())
                                    .then((jsonResp) => {
                                        const shows = jsonResp.data.shows;
                                        resultCallbackFunction({
                                            dataSource: shows,
                                            lastId: shows.length,
                                            virtualDataSourceLength: shows.length
                                        });
                                    });
                            } else {
                                const result = {data: [], lastId: null, virtualDataSourceLength: 0};
                                resultCallbackFunction({
                                    dataSource: result.data,
                                    lastId: 0,
                                    virtualDataSourceLength: result.length
                                });
                            }
                        },
                        keyDataField: 'id',
                        parentDataField: 'parent_id',
                        id: 'id',
                        dataFields: [
                            'name: string',
                            'description: string'
                        ]
                    }),
            }
        }
    });
</script>
