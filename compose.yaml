version: "3.9"
services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: "tayiib"
      POSTGRES_USER: "tayiib"
      POSTGRES_PASSWORD: "tayiib_local"
      PGDATA: "/var/lib/postgresql/data/tayiib"
    volumes:
      - pg-data-tayiib:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg-data-tayiib:
